
name: Build AllayDonationFX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build mod
        run: gradle build
        working-directory: ./AllayDonationFX

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AllayDonationFX
          path: AllayDonationFX/build/libs/*.jar
          if-no-files-found: error
